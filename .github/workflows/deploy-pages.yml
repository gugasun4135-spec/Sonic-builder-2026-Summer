name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check cloud sync variables
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.BQ_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.BQ_SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /Sonic-builder-2026-Summer
          NEXT_PUBLIC_BQ_SYNC_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.BQ_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.BQ_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BQ_GAME_STATE_ID: zhenyu-main
          NEXT_PUBLIC_BQ_CHILD_ID: zhenyu
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
